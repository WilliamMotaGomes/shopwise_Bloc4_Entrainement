spring.application.name=app

spring.datasource.url=jdbc:h2:mem:shopwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

shopwise.security.jwt.secret=${SHOPWISE_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
shopwise.security.jwt.ttl-seconds=3600
shopwise.security.users.admin.password=${SHOPWISE_ADMIN_PASSWORD:admin123}
shopwise.security.users.merchant.password=${SHOPWISE_MERCHANT_PASSWORD:marie123}
shopwise.security.users.clerk.password=${SHOPWISE_CLERK_PASSWORD:clerk123}
